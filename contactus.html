<body>

    <h2>Let's Chat!</h2>

    <!-- Form code adapted from: https://getbootstrap.com/docs/4.4/components/forms/ -->
    <!-- I modified it to include only the input boxes that I want -->
    <form>

        <div class="form-group">
            <label for="emailAddress">Email address</label>
            <input type="email" class="form-control" id="emailAddress" placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="subjectLine">Subject line</label>
            <textarea class="form-control" id="subjectLine"></textarea>
        </div>

        <div class="form-group">
            <label for="emailBody">Example textarea</label>
            <textarea class="form-control" id="emailBody" rows="3"></textarea>
        </div>

        <button type="submit" class="submit btn btn-primary">Submit</button>
    </form>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
